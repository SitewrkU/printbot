services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: printbot
      POSTGRES_PASSWORD: printbot
      POSTGRES_DB: printbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printbot -d printbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
